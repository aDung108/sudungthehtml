<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm</title>
</head>
<body>

    <h2>Tìm kiếm với Google</h2>

    <!-- Form tìm kiếm kết nối Google Search -->
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa cần tìm..." required />
        <input type="submit" value="Tìm kiếm" />
    </form>

</body>
</html>
