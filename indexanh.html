<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      - src: Đường dẫn ảnh trực tiếp trên mạng (Unsplash)
      - alt: Mô tả nội dung bức ảnh khi ảnh bị lỗi hoặc dùng cho trình đọc màn hình
      - width/style: Giới hạn chiều rộng để ảnh vừa vặn với trang web
    -->
    <img 
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" 
        alt="Phong cảnh núi non và hồ nước tuyệt đẹp tại thung lũng Yosemite" 
        width="700"
    >

    <p>Bức ảnh phong cảnh thiên nhiên hùng vĩ tại thung lũng Yosemite.</p>

</body>
</html>
